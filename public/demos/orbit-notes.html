<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Notes</title><link rel="stylesheet" href="demo.css"><script src="demo.js" defer></script></head><body data-demo="notes"><header><a class="notes-logo" href="orbit-notes.html">orbit ✳</a><span>A LITTLE SPACE FOR BIG IDEAS</span></header><main class="notes-main"><div class="notes-intro"><h1>Room for<br><i>your thoughts.</i></h1><button id="add-note" class="outline-button">새 메모 +</button></div><div id="notes-grid" class="notes-grid"></div><p class="notes-foot" id="notes-status" role="status">이 브라우저에 저장되는 나만의 작은 메모 공간.</p></main><dialog id="note-editor"><form id="note-form"><div class="editor-header"><span>YOUR THOUGHT</span><button type="button" id="cancel-note" aria-label="편집 닫기">×</button></div><label for="note-title">제목<input id="note-title" required maxlength="80" placeholder="생각에 이름을 붙여 주세요"></label><label for="note-body">메모<textarea id="note-body" rows="5" maxlength="2000" placeholder="어디서든 시작해 보세요."></textarea></label><label for="note-color">색<select id="note-color"><option value="green">연두</option><option value="orange">살구</option><option value="blue">하늘</option></select></label><div class="editor-actions"><button id="delete-note" type="button">삭제</button><button type="submit" class="outline-button">저장</button></div></form></dialog></body></html>
