<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chromatic Field</title><link rel="stylesheet" href="demo.css"><script src="demo.js" defer></script></head><body data-demo="chromatic"><header><a class="wordmark" href="chromatic-field.html">CHROMATIC FIELD</a><span>AN EXPERIMENT IN COLOR</span></header><main class="chromatic-main"><div class="color-field" id="color-field" aria-hidden="true"></div><div class="color-copy"><p>COLOR · MOTION · PLAY</p><h1>Let your<br><i>curiosity flow.</i></h1><span>포인터를 움직여 보세요.<br>당신의 움직임이 풍경이 됩니다.</span></div><div class="color-controls"><div class="palette-choices" aria-label="색 조합"><button data-palette="0" aria-label="새벽 색 조합" aria-pressed="true" style="--swatch:linear-gradient(130deg,#d3db83,#ed9967,#406895)"></button><button data-palette="1" aria-label="노을 색 조합" aria-pressed="false" style="--swatch:linear-gradient(130deg,#de67a6,#ee935d,#703de0)"></button><button data-palette="2" aria-label="바다 색 조합" aria-pressed="false" style="--swatch:linear-gradient(130deg,#adce76,#368680,#192e90)"></button></div><label class="range-label" for="speed">움직임 <input id="speed" type="range" min="5" max="40" value="18"></label><button id="pause-color" class="outline-button" aria-pressed="false">일시 정지</button></div></main></body></html>
